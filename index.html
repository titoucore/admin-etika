<style>
:root{
  --charbon:#211e1f;      /* fond du logo */
  --surface:#2a2627;
  --blanc:#ffffff;
  --gris:#b3adae;
  --trait:#413c3d;
  --cramoisi:#be1e2f;     /* rouge du i */
  --cramoisi-clair:#e24a59;
  --slab:"Zilla Slab","Rockwell","Roboto Slab",Georgia,serif;
  --condense:"Barlow Semi Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);background:var(--charbon)}
body{margin:0;background:var(--charbon);color:var(--blanc);
  font:1.0625rem/1.5 var(--condense);font-weight:500;-webkit-text-size-adjust:100%}
main{max-width:44rem;margin:0 auto;padding:2.5rem 1.25rem 4rem}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* En-tête : le logo, puis la mention qui remplace « immo » */
.logo{display:block;width:min(20rem,78%);height:auto;margin:0 auto}
.mention{display:flex;align-items:center;gap:1rem;margin:1.25rem 7% 0 5.3%}
.mention .regle{height:3px;background:var(--blanc);transform-origin:left}
.mention .regle.longue{flex:1}
.mention .regle.courte{width:2.75rem}
.mention .mot{font-weight:600;font-size:1.25rem;letter-spacing:.32em;text-transform:uppercase;
  line-height:1;margin-right:-.32em}
.mention .mot b{color:var(--cramoisi-clair);font-weight:600}
@media (prefers-reduced-motion:no-preference){
  .mention .regle{animation:trace .7s cubic-bezier(.2,.7,.2,1) both}
  .mention .regle.courte{animation-delay:.25s}
  @keyframes trace{from{transform:scaleX(0)}to{transform:scaleX(1)}}
}

.intro{margin:3rem 0 .75rem;color:var(--gris)}

/* Liste des applications */
#liste{list-style:none;margin:0;padding:0;border-top:1px solid var(--trait)}
#liste li{display:grid;grid-template-columns:1fr;gap:.9rem;padding:1.25rem 0;border-bottom:1px solid var(--trait)}
.nom{display:block;font-family:var(--slab);font-weight:600;font-size:1.9rem;line-height:1.1;letter-spacing:.005em}
.domaine{display:block;margin-top:.2rem;color:var(--gris);font-size:.95rem;overflow-wrap:anywhere}
.alerte{display:inline-flex;align-items:center;gap:.4rem;margin-top:.45rem;font-size:.9rem;color:var(--gris)}
.alerte::before{content:"";width:.6rem;height:.6rem;border-radius:50%;background:var(--cramoisi-clair)}
.actions{display:flex;flex-wrap:wrap;gap:.6rem}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:2.75rem;padding:0 1.1rem;
  border-radius:4px;border:1px solid #6a6465;color:var(--blanc);font:inherit;font-weight:600;text-decoration:none}
a.btn:hover{border-color:var(--blanc)}
a.btn.admin{background:var(--cramoisi);border-color:var(--cramoisi)}
a.btn.admin:hover{background:#d3283a;border-color:#d3283a}
a.btn:focus-visible{outline:3px solid var(--blanc);outline-offset:3px}
span.btn{border-style:dashed;border-color:#5a5455;color:var(--gris);font-weight:500}
.vide{display:block !important;padding:1.25rem 0;color:var(--gris)}

@media (min-width:36rem){
  #liste li{grid-template-columns:1fr auto;align-items:center;gap:1.5rem}
  .actions{justify-content:flex-end}
}
</style>
</head>
<body>
<main>
  <header>
    <h1 class="sr-only">Etika Atelier : administration des applications</h1>

      <span class="regle longue"></span>
      <span class="mot">ATEL<b>I</b>ER</span>
      <span class="regle courte"></span>

  </header>

  <p class="intro" id="intro">Pages d'administration de toutes les applications.</p>
  <ul id="liste" aria-live="polite"><li class="vide">Chargement…</li></ul>
</main>
<script>
function ligne(app){
  const li = document.createElement("li");

  const id = document.createElement("div");
  const nom = document.createElement("span"); nom.className = "nom"; nom.textContent = app.nom;
  const dom = document.createElement("span"); dom.className = "domaine";
  try { dom.textContent = new URL(app.url).host; } catch { dom.textContent = app.url; }
  id.append(nom, dom);
  if (app.statut === "a_verifier") {
    const al = document.createElement("span"); al.className = "alerte"; al.textContent = "Lien admin à vérifier";
    id.append(al);
  }

  const actions = document.createElement("div"); actions.className = "actions";
  const ouvrir = document.createElement("a");
  ouvrir.className = "btn"; ouvrir.href = app.url; ouvrir.textContent = "Ouvrir l'app";
  ouvrir.target = "_blank"; ouvrir.rel = "noopener noreferrer";
  actions.append(ouvrir);
  if (app.admin) {
    const a = document.createElement("a");
    a.className = "btn admin"; a.href = app.admin; a.textContent = "Ouvrir l'admin";
    a.target = "_blank"; a.rel = "noopener noreferrer";
    actions.append(a);
  } else {
    const s = document.createElement("span"); s.className = "btn"; s.textContent = "Admin à définir";
    actions.append(s);
  }
  li.append(id, actions);
  return li;
}
fetch("apps.json", { cache: "no-store" })
  .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
  .then(apps => {
    document.getElementById("liste").replaceChildren(...apps.map(ligne));
    const n = apps.length, a = apps.filter(x => x.admin).length;
    document.getElementById("intro").textContent =
      n + " applications, " + a + " pages d'administration renseignées.";
  })
  .catch(() => {
    document.getElementById("liste").innerHTML =
      '<li class="vide">Impossible de charger apps.json. Vérifie que le fichier est publié à côté de index.html.</li>';
  });
</script>
</body>
</html>
